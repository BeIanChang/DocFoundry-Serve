services:
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      --host 0.0.0.0
      --port 8000
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]

  gateway:
    build: .
    depends_on:
      - vllm
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      VLLM_BASE_URL: http://vllm:8000/v1
      VLLM_MODEL: ${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      ROUTER_MODE: stage_aware
      POLICY_CONFIG_PATH: /app/config/policies.yaml
      METRICS_PATH: /app/data/metrics/gateway_metrics.jsonl
      METRICS_FORMAT: jsonl
      METRICS_BATCH_SIZE: 50
      METRICS_FLUSH_INTERVAL_SECONDS: 1.0
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_ALGORITHM: HS256
      MAX_IN_FLIGHT: 64
      MAX_QUEUE: 512
      QUEUE_WAIT_TIMEOUT_SECONDS: 2.0
      STAGE_QUEUE_LIMITS: planning:200,synthesis:120,refinement:120
      STAGE_IN_FLIGHT_LIMITS: planning:48,synthesis:24,refinement:24
      VLLM_MAX_RETRIES: 2
      VLLM_RETRY_BACKOFF_MS: 250
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

volumes:
  hf-cache:
